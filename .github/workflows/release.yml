name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual release from the Actions tab (run it on main)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Run the test suite
        run: |
          python -m pip install -e .[dev]
          python -m pytest -q
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # publish only from a version tag or a manual run on main
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # PyPI "trusted publishing": configure this repository + workflow +
    # environment on https://pypi.org/manage/account/publishing/ for the
    # project black-beard-calendarium -- no API token needed.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # tagging an already-published version (e.g. laying the tag
          # down after a manual release) must be a green no-op
          skip-existing: true
